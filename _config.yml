# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: JSON Tools
author: duyetdev
email: me@duyetdev.com
description: > # this means to ignore newlines until "baseurl:"
  A beautiful, fast, and user-friendly web-based JSON parser and editor.
  Parse, validate, format, and view JSON with multiple display modes.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://duyetdev.github.io/json-tools" # the base hostname & protocol for your site
twitter_username: duyetdev
github_username:  duyetdev
lang: en_US
timezone: UTC

encoding: "utf-8"

# Build settings
markdown: kramdown

# Outputting
permalink:     none
paginate_path: /page:num
